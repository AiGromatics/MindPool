<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Activity-bar version of the dashboard mark (media/icon.svg, scaled 100 → 20 and inset 2).
       VS Code paints this file as a mask in the theme colour, so only alpha counts: the tile is
       solid and the grid, ripple, pool ring, core and drop are cut out of it. Strokes are thickened
       so they survive at 24px. -->
  <mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
    <rect x="2" y="2" width="20" height="20" rx="3.7" fill="#fff"/>
    <path d="M18 2v20M2 6h20" stroke="#000" stroke-opacity=".42" stroke-width=".6"/>
    <path d="M10 2v20M2 14h20" stroke="#000" stroke-width="1.2"/>
    <circle cx="10" cy="14" r="6.3" fill="none" stroke="#000" stroke-opacity=".5" stroke-width=".8"/>
    <circle cx="10" cy="14" r="4.4" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <circle cx="10" cy="14" r="1.4" fill="#000"/>
    <path d="M18 3.7s-1.52 2.02-1.52 2.98a1.52 1.52 0 0 0 3.04 0c0-.96-1.52-2.98-1.52-2.98Z" fill="#000"/>
  </mask>
  <rect width="24" height="24" fill="#000" mask="url(#mark)"/>
</svg>
