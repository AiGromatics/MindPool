<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 100 100">
  <title>MindPool by AIgromatics</title>
  <!-- AIgromatics tile: verde field with the survey grid. The crossing holds a pool instead of the groma. -->
  <rect width="100" height="100" rx="18.5" fill="#1F5C55"/>
  <line x1="80" y1="0" x2="80" y2="100" stroke="#F0F3F3" stroke-opacity="0.42" stroke-width="1"/>
  <line x1="0" y1="20" x2="100" y2="20" stroke="#F0F3F3" stroke-opacity="0.42" stroke-width="1"/>
  <line x1="40" y1="0" x2="40" y2="100" stroke="#F0F3F3" stroke-width="2.7"/>
  <line x1="0" y1="60" x2="100" y2="60" stroke="#F0F3F3" stroke-width="2.7"/>
  <!-- ripple: the pool spreading over the grid -->
  <circle cx="40" cy="60" r="31.5" fill="none" stroke="#F0F3F3" stroke-opacity="0.5" stroke-width="2"/>
  <!-- the pool -->
  <circle cx="40" cy="60" r="22.2" fill="#1F5C55" stroke="#F0F3F3" stroke-width="4.9"/>
  <!-- a skill, landed and falling: bronze, like the groma's rod -->
  <circle cx="40" cy="60" r="6.4" fill="#DFB15A"/>
  <path d="M80 8.5C80 8.5 72.4 18.6 72.4 23.4a7.6 7.6 0 0 0 15.2 0C87.6 18.6 80 8.5 80 8.5Z" fill="#DFB15A"/>
</svg>
